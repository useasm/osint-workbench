[package]
name = "osint-workbench"
version = "0.1.0"
description = "OSINT Workbench"
authors = ["OSINT Workbench"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
